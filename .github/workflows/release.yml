name: Release desktop builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.6.0). Leave empty to use the pushed tag / create a draft from the current version."
        required: false
        default: ""
      publish_channel:
        description: "Also push release-artifacts/ (manifest + exes) to the git update channel branch"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install -U pip wheel
          python -m pip install -r requirements-desktop.txt pytest

      - name: Manager + API tests
        run: python -m pytest -q tests/test_manager_*.py tests/test_api.py tests/test_updater.py

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel
          python -m pip install -r requirements-desktop.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-laya.txt
          python packaging/fetch_onboard_ai.py

      - name: Build app + manager + Setup + manifest (signs when WINDOWS_CERT_* secrets exist)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          ROBOSCOUT_REQUIRE_ONBOARD_AI: "1"
        run: pwsh packaging/build_windows.ps1 -SkipInstall -Commit "${{ github.sha }}"

      - name: Smoke-test manager exe
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "rs-smoke"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          # Windowed exes return immediately from `&`; Start-Process -Wait gets the real exit code.
          function Run-Mgr([string]$exe, [string[]]$argv, [string]$outFile) {
            $p = Start-Process -FilePath $exe -ArgumentList ($argv + @("--json", "--out", $outFile, "--root", $root)) -Wait -PassThru
            if (Test-Path $outFile) { Get-Content $outFile } else { Write-Warning "no output file $outFile" }
            if ($p.ExitCode -ne 0) { throw "$exe $($argv -join ' ') exited $($p.ExitCode)" }
          }
          Run-Mgr "dist/release/RoboScoutAI.exe" @("--version") "$root/version.json"
          Run-Mgr "dist/release/RoboScoutAI-Setup.exe" @("--silent", "--no-launch") "$root/setup.json"
          if (-not (Test-Path "$root/current.json")) { throw "Setup did not write current.json" }
          if (-not (Test-Path "$root/app")) { throw "Setup did not create app/" }
          Run-Mgr (Join-Path $root "RoboScoutAI.exe") @("--list") "$root/list.json"
          Run-Mgr (Join-Path $root "RoboScoutAI.exe") @("--uninstall", "--silent") "$root/uninstall.json"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/release/RoboScoutAI-Setup.exe
            dist/release/RoboScoutAI.exe
            dist/release/RoboScoutAI-app-windows-x64.exe
            dist/release/manifest.json
          if-no-files-found: error

  build-macos:
    needs: test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel
          python -m pip install -r requirements-desktop.txt
          python -m pip install torch
          python -m pip install -r requirements-laya.txt
          python packaging/fetch_onboard_ai.py

      - name: Build with PyInstaller
        env:
          ROBOSCOUT_REQUIRE_ONBOARD_AI: "1"
        run: |
          python -m PyInstaller --noconfirm --clean packaging/app.spec
          mv dist/RoboScoutAI-app dist/RoboScoutAI

      - name: Sign & notarize macOS binary (optional)
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
          MACOS_API_KEY_P8_BASE64: ${{ secrets.MACOS_API_KEY_P8_BASE64 }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            echo "::warning::MACOS_CERTIFICATE_P12_BASE64 not set — shipping unsigned (Gatekeeper will quarantine)."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/ramscout-dev-id.p12"
          KEYCHAIN="$RUNNER_TEMP/ramscout.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 12)"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No Developer ID Application identity found in imported certificate."
            exit 1
          fi
          codesign --force --options runtime --timestamp --sign "$IDENTITY" dist/RoboScoutAI
          codesign --verify --verbose=2 dist/RoboScoutAI
          if [[ -n "${MACOS_API_KEY_P8_BASE64:-}" && -n "${MACOS_API_KEY_ID:-}" && -n "${MACOS_API_ISSUER_ID:-}" ]]; then
            KEY_P8="$RUNNER_TEMP/AuthKey_${MACOS_API_KEY_ID}.p8"
            echo "$MACOS_API_KEY_P8_BASE64" | base64 --decode > "$KEY_P8"
            ditto -c -k --keepParent dist/RoboScoutAI "$RUNNER_TEMP/RoboScoutAI-notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/RoboScoutAI-notarize.zip" \
              --key "$KEY_P8" --key-id "$MACOS_API_KEY_ID" --issuer "$MACOS_API_ISSUER_ID" \
              --wait
            xcrun stapler staple dist/RoboScoutAI || true
          else
            echo "::warning::Notarization secrets missing — binary is signed but not notarized."
          fi
          rm -f "$CERT_PATH"
          [[ -n "${KEY_P8:-}" ]] && rm -f "$KEY_P8"
          true

      - name: Package macOS zip
        run: |
          mkdir -p dist/release
          cd dist
          chmod +x RoboScoutAI
          zip -9 "release/RoboScoutAI-macos-arm64.zip" RoboScoutAI

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/release/RoboScoutAI-macos-arm64.zip
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(python -c 'from ramscout import __version__; print(__version__)')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten + verify assets
        shell: bash
        run: |
          mkdir -p out
          find release-assets -type f -print -exec cp {} out/ \;
          ls -lah out
          test -f out/RoboScoutAI-Setup.exe
          test -f out/RoboScoutAI.exe
          test -f out/RoboScoutAI-app-windows-x64.exe
          test -f out/manifest.json
          test -f out/RoboScoutAI-macos-arm64.zip
          python -m roboscout_manager.manifest verify out/manifest.json out/RoboScoutAI-Setup.exe out/RoboScoutAI.exe out/RoboScoutAI-app-windows-x64.exe
          # Manifest version must match the tag we are publishing.
          python - "${{ steps.meta.outputs.tag }}" <<'EOF'
          import json, sys
          tag = sys.argv[1].lstrip("v")
          version = json.load(open("out/manifest.json"))["version"]
          if version != tag:
              raise SystemExit(f"manifest version {version} != tag {tag}; bump ramscout/__init__.py")
          print("manifest", version, "OK")
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: RoboScoutAI ${{ steps.meta.outputs.tag }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: out/*
          body: |
            Desktop builds for **RoboScoutAI**.

            - **Windows (recommended):** download `RoboScoutAI-Setup.exe` and run it once. It installs to `%LOCALAPPDATA%\RoboScoutAI` (no admin), adds Start Menu / Desktop shortcuts and an uninstall entry, and keeps itself up to date from the git update channel (GitHub Releases is the fallback).
            - **Windows (already installed):** click **Update** in the app, or run `RoboScoutAI.exe --update`. Rollback: `RoboScoutAI.exe --rollback`.
            - **Mac (Apple Silicon):** download `RoboScoutAI-macos-arm64.zip`, unzip, then run `./RoboScoutAI`

            `RoboScoutAI.exe` (manager) and `RoboScoutAI-app-windows-x64.exe` are the pieces Setup installs; `manifest.json` carries their sha256 digests. See `docs/DESKTOP_APP.md`.

            If SmartScreen / Gatekeeper warns, see `docs/SIGNING.md`. Signed builds ship when repo signing secrets are configured.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload channel payload
        uses: actions/upload-artifact@v4
        with:
          name: channel-payload
          path: |
            out/manifest.json
            out/RoboScoutAI.exe
            out/RoboScoutAI-app-windows-x64.exe
          if-no-files-found: error

  publish-channel:
    # Commit manifest + exes to release-artifacts/ on the git update channel branch so installed
    # managers (and legacy 0.5.x in-app updaters) pick the release up via git.
    needs: publish
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_channel == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download channel payload
        uses: actions/download-artifact@v4
        with:
          name: channel-payload
          path: channel-payload

      - name: Push release-artifacts to the update channel branch
        shell: bash
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          CHANNEL="$(grep -v '^#' release-artifacts/update-channel.txt | grep -v '^\s*$' | head -n1 | tr -d '[:space:]')"
          echo "channel branch: $CHANNEL (tag $TAG)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RELEASE_SHA="$(git rev-parse HEAD)"
          if git fetch origin "$CHANNEL"; then
            git checkout -B "$CHANNEL" "origin/$CHANNEL"
            # Bring the channel branch up to the released code (so ramscout/__init__.py carries the
            # new version for legacy updaters). Binary conflicts resolve in favour of the release.
            if ! git merge --no-edit -X theirs "$RELEASE_SHA"; then
              git checkout --theirs -- . || true
              git add -A
              git -c core.editor=true commit --no-edit -m "Merge $TAG into $CHANNEL" || true
            fi
          else
            git checkout -B "$CHANNEL" "$RELEASE_SHA"
          fi
          mkdir -p release-artifacts
          # GitHub rejects blobs > 100 MB. Keep the thin manager (+ legacy name) on the
          # channel; point oversized app/Setup builds at the matching GitHub Release URL.
          export GIT_BLOB_LIMIT=95000000
          python3 <<'PY'
          import json, os, pathlib, shutil, subprocess

          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          limit = int(os.environ.get("GIT_BLOB_LIMIT", "95000000"))
          src = pathlib.Path("channel-payload")
          dest = pathlib.Path("release-artifacts")
          dest.mkdir(parents=True, exist_ok=True)

          manifest = json.loads((src / "manifest.json").read_text(encoding="utf-8"))
          for name, art in list(manifest.get("artifacts", {}).items()):
              path = src / name
              size = int(art.get("size") or (path.stat().st_size if path.is_file() else 0))
              art["size"] = size
              use_url = (not path.is_file()) or size > limit or name.endswith("-Setup.exe")
              if use_url:
                  art["url"] = f"https://github.com/{repo}/releases/download/{tag}/{name}"
                  print(f"channel: {name} -> Release URL ({size} bytes)")
              else:
                  shutil.copy2(path, dest / name)
                  art.pop("url", None)
                  print(f"channel: {name} -> git blob ({size} bytes)")
              manifest["artifacts"][name] = art

          mgr = src / "RoboScoutAI.exe"
          if mgr.is_file():
              shutil.copy2(mgr, dest / "RoboScoutAI.exe")
              # Legacy 0.5.x in-app updaters download this name and run it as RoboScoutAI.exe.
              shutil.copy2(mgr, dest / "RoboScoutAI-windows-x64.exe")

          (dest / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          for stale in ("RoboScoutAI-app-windows-x64.exe", "RoboScoutAI-Setup.exe"):
              stale_path = dest / stale
              if stale_path.exists():
                  print(f"removing {stale} from channel tree (hosted on Releases)")
                  stale_path.unlink(missing_ok=True)
                  subprocess.run(
                      ["git", "rm", "-f", "--ignore-unmatch", f"release-artifacts/{stale}"],
                      check=False,
                  )
          PY
          echo "$RELEASE_SHA" > release-artifacts/UPDATE.txt
          git rm -f --ignore-unmatch release-artifacts/RoboScoutAI-app-windows-x64.exe \
            release-artifacts/RoboScoutAI-Setup.exe || true
          git add -f release-artifacts/manifest.json release-artifacts/RoboScoutAI.exe \
            release-artifacts/RoboScoutAI-windows-x64.exe release-artifacts/UPDATE.txt
          # Stage any other small artifacts that remain under the limit.
          for f in release-artifacts/*; do
            [[ -f "$f" ]] || continue
            base="$(basename "$f")"
            case "$base" in
              RoboScoutAI-app-windows-x64.exe|RoboScoutAI-Setup.exe) continue ;;
            esac
            size=$(wc -c < "$f" | tr -d ' ')
            if (( size <= GIT_BLOB_LIMIT )); then
              git add -f "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "channel already up to date"
          else
            git commit -m "Publish RoboScoutAI $TAG on update channel ($CHANNEL)"
          fi
          git push origin "HEAD:$CHANNEL"
